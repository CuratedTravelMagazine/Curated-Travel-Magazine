name: Generate Blog Posts From Feed

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:         # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # REQUIRED so GitHub Actions can push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 requests lxml

      - name: Generate blog posts from feed
        run: |
          python scripts/generate_posts_from_feed.py

      - name: Commit and push posts + images
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Add posts
          git add _posts/*.md

          # Add images
          git add assets/images/blog/*.jpg

          git commit -m "Auto-generate blog posts and images" || echo "No changes to commit"
          git push
