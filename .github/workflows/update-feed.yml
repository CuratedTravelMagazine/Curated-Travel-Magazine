name: Update MSN Feed

permissions:
  contents: write

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Generate feed
        run: |
          python msn-feed/generate_feed.py

      - name: Show feed contents
        run: |
          echo "DEBUG: Checking feed file..."
          ls -l msn-feed/
          cat msn-feed/msn-feed.xml || echo "Feed file missing"

      - name: Commit updated feed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -f msn-feed/msn-feed.xml
          git commit -m "Auto-update MSN feed" || echo "No changes to commit"
          git push
