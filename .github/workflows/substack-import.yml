name: Import Substack Posts

on:
  schedule:
    - cron: "0 13 * * *"   # 9 AM Eastern (UTC-4) → 13:00 UTC
  workflow_dispatch:        # manual run button

permissions:
  contents: write           # ← required so the bot can push

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser turndown

      - name: Run importer
        run: node scripts/import-substack.js

      - name: Commit & push if there are changes
        run: |
          git config user.name "Curated Travel Magazine Bot"
          git config user.email "hello@curatedtravelmagazine.com"
          git add _posts/
          if git diff --staged --quiet; then
            echo "No new posts to import"
          else
            git commit -m "Imported new Substack posts"
            git push
          fi
